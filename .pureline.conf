# shellcheck shell=bash
# shellcheck disable=SC2034  # every setting here is read by pureline
# shellcheck disable=SC2154  # PL_SYMBOLS/PL_PATH_ALIASES are declared -A there
#
# PureLine configuration - Catppuccin, matching starship.toml.
#
# This file is sourced by pureline. Everything in it is optional; delete a
# line and the built-in default applies.
#
# ---------------------------------------------------------------------------
# CUSTOMISING
#
#   Order:   reorder, comment out, or add lines in PL_SEGMENTS. Segments are
#            rendered top to bottom, left to right.
#   Colours: each PL_SEGMENTS line is  'segment_name  Background  Foreground'
#            using any colour name from the palette below. Define your own
#            with:  pl_define_color MyPink '#f5c2e7'
#   Palette: pl_load_palette takes catppuccin_mocha, catppuccin_macchiato,
#            catppuccin_frappe or catppuccin_latte.
#   Glyphs:  every icon is a PL_SYMBOLS entry near the bottom of this file.
# ---------------------------------------------------------------------------

# -- Palette ----------------------------------------------------------------
# Defines Rosewater Flamingo Pink Mauve Red Maroon Peach Yellow Green Teal
# Sky Sapphire Blue Lavender Text Subtext1 Subtext0 Overlay2 Overlay1
# Overlay0 Surface2 Surface1 Surface0 Base Mantle Crust
pl_load_palette catppuccin_mocha

# Add or override individual colours after loading the palette:
#   pl_define_color MyPink '#f5c2e7'
# and then use MyPink as a background or foreground in PL_SEGMENTS.

# -- Segments ---------------------------------------------------------------
# Reorder or comment out freely. The two colour columns are the segment's
# background and foreground.
PL_SEGMENTS=(
  # segment                 Background  Foreground
  # ----------------------  ----------  ----------
  'os_segment               Red         Crust'
  'time_segment             Red         Crust'
  'user_segment             Lavender    Crust'
  'ssh_segment              Maroon      Crust'
  'screen_session_segment   Surface2    Text'
# 'tmux_session_segment     Surface2    Text'    # tmux status bar shows it
  'path_segment             Peach       Crust'
  'read_only_segment        Red         Crust'
  'git_segment              Yellow      Crust'
  'lang_segment             Green       Crust'
  'background_jobs_segment  Mauve       Crust'
  'return_code_segment      Red         Crust'
  'newline_segment'
  'character_segment        Default     Green'
# The Python virtualenv is shown inside lang_segment, the way starship's
# [python] module does. Enable this instead if you turn lang_segment off.
# 'virtual_env_segment      Sapphire    Crust'
# 'duration_segment         Lavender    Crust'   # last command's run time
# 'pwd_segment              Peach       Crust'   # arrow-separated path
# 'prompt_segment           Surface2    Text'    # classic $ / # prompt
# 'kubernetes_segment       Sapphire    Crust'
# 'aws_profile_segment      Peach       Crust'
)

# -- Segment options --------------------------------------------------------
PL_PATH_TRIM=3             # 0 full path, 1 current dir only, 2+ keep N parts
PL_TIME_SHOW_SECONDS=false # starship's theme uses %R, i.e. hh:mm
PL_USER_SHOW_HOST=true     # show user@host
PL_USER_LOWERCASE=true     # fold user and host to lower case
PL_USER_USE_IP=false
PL_SSH_SHOW_HOST=true
PL_SSH_USE_IP=false
PL_LANG_SHOW_VERSION=true  # false shows only the language icon
PL_PYTHON_SHOW_VENV=true   # append (venv-name) to the Python version
PL_CHARACTER_ERROR_FG=Red  # colour of the prompt glyph after a failure
PL_ERASE_TO_EOL=false      # set true if your terminal leaves artefacts

# Git indicators. Set any of these to false to drop that counter.
PL_GIT_AHEAD=true
PL_GIT_MODIFIED=true
PL_GIT_STAGED=true
PL_GIT_DELETED=true
PL_GIT_CONFLICTS=true
PL_GIT_UNTRACKED=true
PL_GIT_STASH=true
# true  -> "!2 ?1"  (how many files are in each state)
# false -> "!?"     (bare symbols, exactly what starship's theme shows)
PL_GIT_SHOW_COUNTS=true
# Recolour the git segment when the working tree is dirty. Leave both empty
# to keep the segment the same colour at all times.
PL_GIT_DIRTY_BG=''
PL_GIT_DIRTY_FG=''

# Colours used for the classic prompt_segment when running as root.
PL_PROMPT_ROOT_BG=Red
PL_PROMPT_ROOT_FG=Crust

# -- Symbols ----------------------------------------------------------------
# Requires a Nerd Font. Every glyph here is one starship uses, so the prompt
# renders with the same icons as starship.toml.
#
# Glyphs are written as $'\uXXXX' rather than as literal characters. Most of
# them live in the Unicode Private Use Area, which editors, terminals and
# copy-paste routinely mangle or drop; the escape always survives, and it
# records exactly which codepoint is meant.

# Powerline separators.
PL_SYMBOLS[segment_head]=$'\ue0b6'         # rounded cap, opens a line
PL_SYMBOLS[segment_tail]=$'\ue0b4'         # rounded cap, closes a line
PL_SYMBOLS[hard_separator]=$'\ue0b0'       # solid triangle, between two colours
PL_SYMBOLS[soft_separator]=''              # blank: joins same-colour segments
PL_SYMBOLS[pwd_separator]=$'\ue0b1'        # thin triangle, pwd_segment only

# The OS logo is chosen automatically from $OSTYPE and /etc/os-release.
# Uncomment to pin it:
# PL_SYMBOLS[os]=$'\U000f0035'

PL_SYMBOLS[time]=''                        # blank: no clock icon
PL_SYMBOLS[duration]=$'\ueaf4'             # stopwatch
PL_SYMBOLS[character]=$'❯'                 # heavy right angle quote
PL_SYMBOLS[path_trimmed]=$'…/'             # ellipsis, marks a trimmed path

# Git. These are starship's own defaults, so the two prompts read alike.
PL_SYMBOLS[git_branch]=$'\uf418'           # git branch
PL_SYMBOLS[git_detached]=$'\uf417'         # git commit, for a detached HEAD
PL_SYMBOLS[git_ahead]=$'\uf062'            # arrow up, commits ahead of upstream
PL_SYMBOLS[git_behind]=$'\uf063'           # arrow down, commits behind upstream
PL_SYMBOLS[git_modified]='!'               # changed in the working tree
PL_SYMBOLS[git_staged]='+'                 # staged in the index
PL_SYMBOLS[git_deleted]='✘'                # heavy ballot X, deleted file
PL_SYMBOLS[git_untracked]='?'              # untracked file
PL_SYMBOLS[git_conflicts]='='              # merge conflict
PL_SYMBOLS[git_stash]='$'                  # stash entries

# Languages, matching the symbols in starship.toml.
PL_SYMBOLS[lang_nodejs]=$'\ue718'          # Node.js hexagon
PL_SYMBOLS[lang_bun]=$'\ue76f'             # Bun
PL_SYMBOLS[lang_python]=$'\ue606'          # Python
PL_SYMBOLS[lang_rust]=$'\ue7a8'            # Rust gear
PL_SYMBOLS[lang_golang]=$'\ue627'          # Go
PL_SYMBOLS[lang_php]=$'\ue608'             # PHP elephant
PL_SYMBOLS[lang_java]=$'\ue256'            # Java
PL_SYMBOLS[lang_kotlin]=$'\ue634'          # Kotlin
PL_SYMBOLS[lang_haskell]=$'\ue61f'         # Haskell
PL_SYMBOLS[lang_c]=$'\ue61e'               # C

PL_SYMBOLS[python]=$'\ue606'               # Python, virtual_env_segment only
PL_SYMBOLS[read_only]=$'\uf023'            # padlock, directory is not writable
PL_SYMBOLS[return_code]=$'\uf00d'          # cross, last command failed
PL_SYMBOLS[background_jobs]=$'\uf013'      # cog, running background jobs
PL_SYMBOLS[ssh]=$'\uf233'                  # server, remote session
PL_SYMBOLS[screen]=$'\uf108'               # display, GNU screen session
PL_SYMBOLS[tmux]=$'\uebc8'                 # terminal, tmux session
PL_SYMBOLS[aws_profile]=$'\uf0c2'          # cloud, AWS profile
PL_SYMBOLS[kubernetes]=$'⎈'                # helm, kubectl context

# -- Per-host overrides -----------------------------------------------------
# Nerd Fonts ship in two widths. The "Mono" faces squeeze every icon into one
# cell; the plain faces let icons spill into the next cell, which looks fine
# in an editor but in a terminal draws the icon over whatever follows it.
# Ghostty constrains icons to one cell itself, so this never shows on macOS.
# Windows Terminal does not, so on WSL the ahead/behind arrow -- the only
# icon here that is directly followed by a character -- overlaps its count.
#
# The real fix is choosing a "... Nerd Font Mono" face in Windows Terminal.
# Until then, plain Unicode arrows are a safe stand-in: every monospace font
# draws them at exactly one cell.
if [[ -n ${WSL_DISTRO_NAME} ]]; then
  PL_SYMBOLS[git_ahead]=$'\u2191'   # upwards arrow
  PL_SYMBOLS[git_behind]=$'\u2193'  # downwards arrow
fi

# -- Directory icons --------------------------------------------------------
# starship's [directory.substitutions]: replaces a directory name with an
# icon wherever it appears in the path.
PL_PATH_ALIASES=(
  [Documents]=$'\U000f0219'  # document
  [Downloads]=$'\uf019'      # download arrow
  [Music]=$'\U000f075a'      # music note
  [Pictures]=$'\uf03e'       # picture
  [Developer]=$'\U000f0c8b'  # code braces
)

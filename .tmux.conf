# ~/.tmux.conf - tmux configuration.
#
# Hand-written, no plugins and no plugin manager, so a fresh checkout works
# with nothing but tmux installed. Colours are Catppuccin Mocha, matching the
# pureline prompt, and the status bar uses plain colours (no Powerline glyphs)
# so it renders the same with or without a Nerd Font.

# -- Terminal, colour and keys ----------------------------------------------
# Give panes a 256-colour terminfo, and let each attaching terminal's real
# colour depth drive the rest rather than forcing 24-bit on everyone:
#
#   - A terminal that advertises truecolor sets COLORTERM=truecolor (Ghostty,
#     Windows Terminal). tmux then enables RGB for that client on its own and
#     passes 24-bit through, and update-environment hands the COLORTERM to the
#     pane shells, so pureline emits 24-bit escapes: the exact palette.
#   - A terminal that does not (an older PuTTY) sets no COLORTERM, so panes
#     get none, pureline stays at 256 colours, and tmux sends 256 colours,
#     which such terminals render correctly.
#
# Forcing COLORTERM=truecolor here instead would push 24-bit escapes into a
# PuTTY that cannot parse them, which it renders as garish red and blue.
# Prefer the tmux-256color terminfo; fall back to screen-256color where it is
# not installed (some minimal RHEL setups lack ncurses-term), since that one
# is present almost everywhere. A wrong or missing terminfo is itself a cause
# of broken colours.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga  update-environment  COLORTERM

# Forward "extended keys" (CSI-u sequences) from the outer terminal to the
# program inside tmux. Without this, modified keys like Shift+Enter (which
# Ghostty sends natively) are swallowed by tmux and never reach apps like
# Claude Code. 'on' passes them through when the app requests the protocol;
# the terminal-features line says the outer terminal understands them.
set  -s  extended-keys      on
set -as  terminal-features  'xterm*:extkeys'

# -- General behaviour ------------------------------------------------------
set  -g  history-limit      100000  # lines of scrollback per pane
set -sg  escape-time        10      # ms; 0 can eat vim's <Esc>, 10 is safe
set  -g  mouse              on      # select, resize and scroll with the mouse
set  -g  focus-events       on      # let vim & co. react to focus in/out
set  -g  set-clipboard      on      # copy to the system clipboard (OSC 52)
set  -g  display-time       2000    # ms a status message stays up
set  -g  status-interval    5       # seconds between status-bar refreshes

# Number windows and panes from 1, and keep them gap-free as they close.
set  -g  base-index         1
setw -g  pane-base-index    1
set  -g  renumber-windows   on

# When several clients share a session, size each window to the smallest
# client actually looking at it rather than to the whole session.
setw -g  aggressive-resize  on

# vi keys in copy mode.
setw -g  mode-keys          vi

# -- Key bindings -----------------------------------------------------------
# Prefix stays C-b. cmd+a is rebound in the terminal to send ^A (start of
# line), so C-a as a prefix would collide with it.

# Reload this file without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message " ~/.tmux.conf reloaded"

# Split so the glyph matches the direction, and keep the current directory.
# The defaults (% and ") stay bound as well.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in the current directory too.
bind c new-window -c "#{pane_current_path}"

# Move between panes with vim keys; resize with the shifted ones (repeatable).
bind   h select-pane -L
bind   j select-pane -D
bind   k select-pane -U
bind   l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-style selection in copy mode: v to start, y to yank, r for a block.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle

# -- Theme: Catppuccin Mocha ------------------------------------------------
# Palette (same hexes as the prompt): base 1e1e2e, crust 11111b, surface1
# 45475a, surface2 585b70, subtext0 a6adc8, text cdd6f4, mauve cba6f7,
# blue 89b4fa.

set  -g  status               on
set  -g  status-position      bottom
set  -g  status-justify       left
set  -g  status-style         "bg=#1e1e2e,fg=#cdd6f4"
set  -g  status-left-length   40
set  -g  status-right-length  80

# Left: the session name in a mauve block.
set  -g  status-left  "#[fg=#11111b,bg=#cba6f7,bold] #S #[fg=default,bg=default] "

# Windows: the current one in a blue block, the rest dim. #I is the index,
# #W the name, #F the flags (* current, - last, Z zoomed, and so on).
setw -g  window-status-format          "#[fg=#a6adc8,bg=#1e1e2e] #I:#W#F "
setw -g  window-status-current-format  "#[fg=#11111b,bg=#89b4fa,bold] #I:#W#F "
setw -g  window-status-separator       ""

# Right: host, date and time, split by thin dividers.
set  -g  status-right  "#[fg=#a6adc8] #H #[fg=#585b70]│#[fg=#a6adc8] %Y-%m-%d #[fg=#585b70]│#[fg=#a6adc8] %H:%M "

# Panes, messages and copy-mode selection.
set  -g  pane-border-style         "fg=#45475a"
set  -g  pane-active-border-style  "fg=#cba6f7"
set  -g  message-style             "bg=#cba6f7,fg=#11111b"
set  -g  mode-style                "bg=#585b70,fg=#cdd6f4"
set  -g  clock-mode-colour         "#cba6f7"
